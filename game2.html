<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중력 스위치</title>
<style>
body{margin:0;background:#080910;color:white;font-family:Arial;text-align:center}
canvas{width:min(94vw,800px);background:#101321;border:1px solid #38415f;border-radius:15px}
button{margin:12px;padding:12px 25px;border:0;border-radius:10px;background:#72e6ff;font-weight:bold}
</style>
</head>
<body>
<h1>중력 스위치 · GRAVITY SWITCH</h1>
<p>SPACE / CLICK = 중력 반전 · 장애물을 피하세요</p>
<canvas id="c" width="800" height="500"></canvas>
<br><button onclick="location.reload()">RESTART</button>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let p={x:120,y:250,r:13,vy:0},grav=1,obs=[],score=0,speed=4,dead=0;
onkeydown=e=>{if(e.code==="Space")grav*=-1};
c.onclick=()=>grav*=-1;
for(let i=0;i<12;i++)obs.push({x:500+i*300,gap:170});
function loop(){
 if(dead)return;
 x.fillStyle="#101321";x.fillRect(0,0,800,500);
 p.vy+=.42*grav;p.y+=p.vy;
 if(p.y<13||p.y>487){dead=1;return end()}
 if(Math.random()<.018)grav*=-1;
 obs.forEach(o=>{
   o.x-=speed;
   if(o.x<-50){o.x=3500;score++}
   let gapY=250+Math.sin(o.x*.013)*100;
   x.fillStyle="#ff477e";
   x.fillRect(o.x,0,45,gapY-o.gap/2);
   x.fillRect(o.x,gapY+o.gap/2,45,500);
   if(p.x+13>o.x&&p.x-13<o.x+45&&(p.y-13<gapY-o.gap/2||p.y+13>gapY+o.gap/2)){dead=1;end()}
 });
 x.fillStyle="#70e8ff";x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();
 x.fillStyle="white";x.font="bold 20px Arial";x.fillText("SCORE "+score,20,30);
 requestAnimationFrame(loop)
}
function end(){alert("GAME OVER\nSCORE: "+score)}
loop();
</script>
</body>
</html>
